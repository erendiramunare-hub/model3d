<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prueba Piloto WebAR Canvas</title>
  
  <!-- Motor 3D A-Frame -->
  <script src="[suspicious link removed]"></script>
  <!-- Motor WebAR MindAR -->
  <script src="[suspicious link removed]"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>

  <!-- Escena vinculada al marcador targets.mind -->
  <a-scene 
    mindar-image="imageTargetSrc: targets.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-assets>
      <!-- Carga directa de tu modelo 3D de Encatrinados -->
      <a-asset-item id="piezaModel" src="https://erendiramunare-hub.github.io/model3d/encatrinados3d.glb"></a-asset-item>
    </a-assets>

    <!-- Cámara del navegador -->
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Proyección del modelo al detectar el marcador -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model 
        src="#piezaModel" 
        position="0 0 0" 
        scale="0.3 0.3 0.3" 
        rotation="0 0 0">
      </a-gltf-model>
    </a-entity>

  </a-scene>

</body>
</html>
