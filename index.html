<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor 3D Museo</title>
  
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: #1a1a1a;
      font-family: sans-serif;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: #1a1a1a;
    }
  </style>
</head>
<body>

  <model-viewer 
    src="encatrinados3d.glb" 
    ar 
    ar-modes="webxr scene-viewer quick-look" 
    camera-controls 
    auto-rotate 
    shadow-intensity="1"
    bounds="tight"
    alt="Pieza 3D Arqueológica">
  </model-viewer>

</body>
</html>
