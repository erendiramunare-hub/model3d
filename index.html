<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor 3D WebXR</title>
  
  <script type="module" src="//cdn.jsdelivr.net/npm/@google/model-viewer@3.3.0/dist/model-viewer.min.js"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    model-viewer {
      width: 100%;
      height: 100%;
      background-color: #f8f9fa;
    }
  </style>
</head>
<body>

  <model-viewer 
    src="encatrinados3d.glb" 
    ar 
    ar-modes="webxr" 
    camera-controls 
    auto-rotate 
    shadow-intensity="1"
    alt="Pieza 3D en Realidad Aumentada">
  </model-viewer>

</body>
</html>
